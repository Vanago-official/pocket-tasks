[package]
name = "pocket-tasks"
version = "0.1.0"
edition = "2021"
description = "Minimal TUI task tracker synced with Google Tasks"

[[bin]]
name = "ptask"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
